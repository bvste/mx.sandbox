<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX Lab - Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    
    <div class="bg-amber-50 p-8 rounded-2xl shadow-md border border-amber-300 w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-slate-700 mb-2">MX Lab Entry</h1>
        <p class="text-stone-500 text-sm mb-6">Please sign in below to begin the simulation.</p>
        
        <div class="space-y-4">
            <input type="text" id="fName" placeholder="First Name" 
                   class="w-full bg-white border border-amber-300 text-stone-900 placeholder-stone-400 p-3 rounded-lg focus:outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 transition-colors">
            
            <input type="text" id="lName" placeholder="Last Name" 
                   class="w-full bg-white border border-amber-300 text-stone-900 placeholder-stone-400 p-3 rounded-lg focus:outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 transition-colors">
            
            <input type="text" id="period" placeholder="Class Period (e.g., 3rd)" 
                   class="w-full bg-white border border-amber-300 text-stone-900 placeholder-stone-400 p-3 rounded-lg focus:outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 transition-colors">
            
            <button onclick="login()" 
                    class="w-full bg-slate-600 hover:bg-slate-700 py-3 rounded-lg font-bold text-amber-50 transition-all transform active:scale-95 shadow-md">
                Enter Lab
            </button>
        </div>
    </div>

    <script>
        function login() {
            const data = {
                fName: document.getElementById('fName').value.trim(),
                lName: document.getElementById('lName').value.trim(),
                period: document.getElementById('period').value.trim()
            };
            if(!data.fName || !data.lName || !data.period) {
                alert("All fields are required to proceed.");
                return;
            }
            sessionStorage.setItem('activeStudent', JSON.stringify(data));
            window.location.href = 'lab.html';
        }
    </script>
</body>
</html>
